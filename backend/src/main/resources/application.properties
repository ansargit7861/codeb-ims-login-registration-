spring.application.name=ims-backend

# ---------- Database (PostgreSQL) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/codeb_ims
spring.datasource.username=postgres
spring.datasource.password=your_postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- Mail (used for verification + reset password emails) ----------
# Example uses Gmail SMTP with an App Password. Replace with your own provider.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- JWT ----------
# Replace with a long, random, private value in production (never commit real secrets).
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_MIN_32_CHARS
# 30 minutes session (auto logout after inactivity)
app.jwt.expiration-ms=1800000

# ---------- Frontend URL (used to build email links) ----------
app.frontend-url=http://localhost:5173

server.port=8080
